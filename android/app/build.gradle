plugins {
    id "com.android.application"
}

android {
    namespace "com.career107.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.career107.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK installs for testing.
            // Replace with the client's keystore before publishing.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    // The Go runtime, built by `gomobile bind` (see scripts/build-apk.sh).
    implementation files("libs/career107.aar")
}
